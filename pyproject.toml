[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderhack"
version = "0.0.0"
description = "TenderHack local support service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.0",
  "pydantic==2.12.5",
  "uvicorn==0.40.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["contracts/python", "backend", "."]
include = ["tenderhack_contracts*", "tenderhack_backend*", "knowledge*"]

[tool.pytest.ini_options]
testpaths = ["tests", "knowledge/policy/tests", "knowledge/kb/tests"]
addopts = "-q"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

